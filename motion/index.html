<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basil Boh — Brand Field</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Transparent canvas — renders to an alpha WebM that drops onto
         either the light (#fff) or dark (#000) theme of the site. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        background: transparent;
        overflow: hidden;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: transparent;
      }

      /* --- Layer 1: drifting grid -------------------------------------- */
      .grid {
        position: absolute;
        inset: -80px;
        background-image: linear-gradient(rgba(73, 79, 223, 0.11) 1px, transparent 1px),
          linear-gradient(90deg, rgba(73, 79, 223, 0.11) 1px, transparent 1px);
        background-size: 64px 64px;
        /* soft vignette so the grid fades at the edges */
        -webkit-mask-image: radial-gradient(120% 110% at 50% 45%, #000 30%, transparent 78%);
        mask-image: radial-gradient(120% 110% at 50% 45%, #000 30%, transparent 78%);
      }

      /* --- Layer 2: volumetric indigo glows ---------------------------- */
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        will-change: transform;
      }
      .glow--a {
        width: 760px;
        height: 760px;
        left: 1080px;
        top: -160px;
        background: radial-gradient(circle, rgba(73, 79, 223, 0.55), transparent 65%);
      }
      .glow--b {
        width: 620px;
        height: 620px;
        left: -120px;
        top: 560px;
        background: radial-gradient(circle, rgba(88, 166, 255, 0.34), transparent 65%);
      }
      .glow--c {
        width: 520px;
        height: 520px;
        left: 820px;
        top: 520px;
        background: radial-gradient(circle, rgba(67, 211, 158, 0.18), transparent 65%);
      }

      /* --- Layer 3: particle constellation ----------------------------- */
      .dot {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(73, 79, 223, 0.85);
        box-shadow: 0 0 12px rgba(73, 79, 223, 0.7);
        will-change: transform;
      }
      .line {
        position: absolute;
        height: 1px;
        transform-origin: left center;
        background: linear-gradient(90deg, rgba(73, 79, 223, 0.4), transparent);
      }

      /* --- Layer 4: light sheen sweep ---------------------------------- */
      .sheen {
        position: absolute;
        top: -200px;
        left: 0;
        width: 360px;
        height: 1480px;
        transform: rotate(18deg);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.04) 35%,
          rgba(130, 136, 255, 0.12) 50%,
          rgba(255, 255, 255, 0.04) 65%,
          transparent
        );
        filter: blur(14px);
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="field"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="8"
    >
      <div id="hero-grid" class="grid clip" data-start="0" data-duration="8" data-track-index="0"></div>

      <div id="glow-a" class="glow glow--a clip" data-start="0" data-duration="8" data-track-index="1"></div>
      <div id="glow-b" class="glow glow--b clip" data-start="0" data-duration="8" data-track-index="2"></div>
      <div id="glow-c" class="glow glow--c clip" data-start="0" data-duration="8" data-track-index="3"></div>

      <!-- particle constellation (deterministic, hand-placed) -->
      <div id="dots" class="clip" data-start="0" data-duration="8" data-track-index="4">
        <div class="dot" style="left: 240px; top: 300px"></div>
        <div class="dot" style="left: 430px; top: 540px"></div>
        <div class="dot" style="left: 360px; top: 820px"></div>
        <div class="dot" style="left: 700px; top: 260px"></div>
        <div class="dot" style="left: 980px; top: 700px"></div>
        <div class="dot" style="left: 1180px; top: 380px"></div>
        <div class="dot" style="left: 1420px; top: 640px"></div>
        <div class="dot" style="left: 1600px; top: 300px"></div>
        <div class="dot" style="left: 1500px; top: 880px"></div>
        <div class="dot" style="left: 820px; top: 460px"></div>
        <div class="dot" style="left: 120px; top: 660px"></div>
        <div class="dot" style="left: 1320px; top: 180px"></div>
      </div>

      <div id="hero-sheen" class="sheen clip" data-start="0" data-duration="8" data-track-index="5"></div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const LOOP = 8;

        // Grid: drift exactly one cell (64px) so the loop boundary is seamless.
        tl.fromTo(
          ".grid",
          { backgroundPosition: "0px 0px" },
          { backgroundPosition: "64px 64px", duration: LOOP, ease: "none" },
          0,
        );

        // Glows: slow breathing drift — yoyo over half the loop returns to
        // the exact start state at t=LOOP (seamless).
        const half = LOOP / 2;
        tl.fromTo(".glow--a", { x: 0, y: 0, scale: 1 },
          { x: -90, y: 60, scale: 1.12, duration: half, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo(".glow--b", { x: 0, y: 0, scale: 1 },
          { x: 70, y: -50, scale: 1.16, duration: half, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.fromTo(".glow--c", { x: 0, y: 0, scale: 1 },
          { x: -60, y: -40, scale: 1.1, duration: half, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

        // Particles: each dot floats on a gentle sine, returning to origin.
        const dots = gsap.utils.toArray(".dot");
        dots.forEach((dot, i) => {
          const dir = i % 2 === 0 ? 1 : -1;
          const amp = 14 + (i % 4) * 6;
          tl.fromTo(dot, { y: 0, opacity: 0.55 },
            { y: dir * amp, opacity: 1, duration: half, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        });

        // Sheen: travels fully off-screen on both ends → invisible at the
        // seam, so the loop is clean.
        tl.fromTo(".sheen", { x: -700 }, { x: 2400, duration: LOOP, ease: "none" }, 0);

        window.__timelines["field"] = tl;
      </script>
    </div>
  </body>
</html>
